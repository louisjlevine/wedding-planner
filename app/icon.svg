<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dodger-style blue circle background -->
  <circle cx="50" cy="50" r="50" fill="#005A9C"/>

  <!-- A drawn first (behind L) -->
  <line x1="60" y1="13" x2="34" y2="87" stroke="white" stroke-width="11" stroke-linecap="butt"/>
  <line x1="60" y1="13" x2="86" y2="87" stroke="white" stroke-width="11" stroke-linecap="butt"/>
  <!-- Crossbar of A -->
  <line x1="45" y1="56" x2="75" y2="56" stroke="white" stroke-width="8" stroke-linecap="butt"/>

  <!-- L drawn on top — vertical bar then horizontal base overlaps A's left diagonal -->
  <rect x="8" y="13" width="11" height="63" fill="white"/>
  <rect x="8" y="76" width="36" height="11" fill="white"/>
</svg>
