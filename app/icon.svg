<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .letters { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 48px; fill: #f5f0e8; }
      .plus { font-family: system-ui, -apple-system, sans-serif; font-weight: 300; font-size: 20px; fill: #f5f0e8; opacity: 0.7; }
    </style>
  </defs>
  <rect width="100" height="100" fill="#1a1a2e"/>
  <text x="30" y="67" text-anchor="middle" class="letters">L</text>
  <text x="50" y="63" text-anchor="middle" class="plus">+</text>
  <text x="70" y="67" text-anchor="middle" class="letters">A</text>
</svg>
