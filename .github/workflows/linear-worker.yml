name: Wedding Planner — Linear Issue Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement-linear-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@beta
        env:
          LINEAR_ACCESS_TOKEN: ${{ secrets.LINEAR_ACCESS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          direct_prompt: |
            You are an automated issue worker for the Wedding Planner project
            (https://github.com/louisjlevine/wedding-planner).

            You have access to the Linear GraphQL API via the LINEAR_ACCESS_TOKEN
            environment variable. Use curl to call https://api.linear.app/graphql
            with header `Authorization: $LINEAR_ACCESS_TOKEN`.

            ── STEP 0 — PRE-FLIGHT STATUS CHECK ──────────────────────────────

            BEFORE doing any implementation work, you MUST verify the ticket is
            in an actionable state.

            Query the "Wedding Website" project's open issues, sorted by priority:
              curl -s -X POST https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"query": "{ issues(filter: { project: { name: { eq: \"Wedding Website\" } }, state: { type: { in: [\"unstarted\", \"started\"] } } }, orderBy: priority) { nodes { id identifier title priority state { name type } description url team { id } } } }"}'

            Pick the highest-priority issue (priority: 1=Urgent, 2=High, 3=Medium,
            4=Low, 0=No priority — treat 0 as lowest).

            ONLY PROCEED if the state type is "unstarted" or "started" AND the
            state name is NOT any of: "In Review", "Done", "Cancelled", "Closed",
            "Completed", "Archived", "Duplicate".

            If the ticket is in any closed/review/done state, or if no open issues
            exist, print:
              "No actionable issues — skipping this run."
            and STOP IMMEDIATELY. Do not create branches or PRs.

            ── STEP 1 — IMPLEMENT THE ISSUE ───────────────────────────────────

            Read the full issue description from the Step 0 response.
            Read CLAUDE.md for project coding standards.
            Implement the changes. Follow these rules:
            - Tailwind only, no inline styles
            - Pink accent #D4537E for CTAs and active states
            - No emoji in UI (except final wedding day milestone)
            - All AI responses in <pre className="whitespace-pre-wrap">
            Run `npm test` to verify nothing breaks.

            ── STEP 2 — COMMIT AND PUSH ────────────────────────────────────────

            Create a branch named linear/<issue-identifier>-<short-slug>.
            Commit all changes with a message referencing the Linear issue
            identifier (e.g. "WED-42: Add guest RSVP tracking").
            Push the branch to origin.

            ── STEP 3 — CREATE A PULL REQUEST ──────────────────────────────────

            Open a pull request targeting main. Include:
            - Summary of changes (what and why)
            - Link to the Linear issue URL
            - Test results

            ── STEP 4 — MARK ISSUE IN REVIEW ───────────────────────────────────

            Find the "In Review" workflow state ID for the issue's team:
              curl -s -X POST https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"query": "{ workflowStates(filter: { team: { id: { eq: \"<TEAM_ID>\" } }, name: { eq: \"In Review\" } }) { nodes { id name type } } }"}'

            Then update the issue's state:
              curl -s -X POST https://api.linear.app/graphql \
                -H "Authorization: $LINEAR_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"query": "mutation { issueUpdate(id: \"<ISSUE_ID>\", input: { stateId: \"<IN_REVIEW_STATE_ID>\" }) { success } }"}'

            Confirm the mutation returned success: true before finishing.
