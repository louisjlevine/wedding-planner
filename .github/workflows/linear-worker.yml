name: Wedding Planner — Linear Issue Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement-linear-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,mcp__linear__list_issues,mcp__linear__list_issue_statuses,mcp__linear__get_issue,mcp__linear__save_issue,mcp__linear__list_projects,mcp__linear__list_teams"
          mcp_config: |
            {
              "mcpServers": {
                "linear": {
                  "type": "connector",
                  "connector_id": "8c0518ab-9c19-4121-a304-3cb7c9c4b97c"
                }
              }
            }
          direct_prompt: |
            You are an automated issue worker for the Wedding Planner project
            (https://github.com/louisjlevine/wedding-planner).

            You have the Linear MCP connector attached. Use the mcp__linear__
            tools to interact with Linear — do NOT use curl for Linear API calls.

            ── STEP 0 — PRE-FLIGHT STATUS CHECK ──────────────────────────────

            BEFORE doing any implementation work, you MUST verify there is an
            actionable ticket.

            Use mcp__linear__list_issues with project "Wedding Website" and
            includeArchived: false to fetch issues. Examine each issue's
            statusType and status fields.

            Pick the highest-priority issue where:
            - priority: 1=Urgent, 2=High, 3=Medium, 4=Low, 0=No priority
              (treat 0 as lowest)
            - statusType is one of: "unstarted", "backlog", or "started"
            - status name is NOT any of: "In Review", "Done", "Cancelled",
              "Closed", "Completed", "Archived", "Duplicate"

            If NO actionable issues exist, print:
              "No actionable issues — skipping this run."
            and STOP IMMEDIATELY. Do not create branches, commits, or PRs.

            ── STEP 1 — IMPLEMENT THE ISSUE ───────────────────────────────────

            Use mcp__linear__get_issue to fetch the full issue description.
            Read CLAUDE.md for project coding standards.
            Implement the changes. Follow these rules:
            - Tailwind only, no inline styles
            - Pink accent #D4537E for CTAs and active states
            - No emoji in UI (except final wedding day milestone)
            - All AI responses in <pre className="whitespace-pre-wrap">
            Run `npm test` to verify nothing breaks.

            ── STEP 2 — COMMIT AND PUSH ────────────────────────────────────────

            Create a branch named linear/<issue-identifier>-<short-slug>.
            Commit all changes with a message referencing the Linear issue
            identifier (e.g. "LJL-42: Add guest RSVP tracking").
            Push the branch to origin.

            ── STEP 3 — CREATE A PULL REQUEST ──────────────────────────────────

            Open a pull request targeting main. Include:
            - Summary of changes (what and why)
            - Link to the Linear issue URL
            - Test results

            ── STEP 4 — MARK ISSUE IN REVIEW ───────────────────────────────────

            First, use mcp__linear__list_issue_statuses with the issue's team
            name to find the "In Review" state ID.

            Then use mcp__linear__save_issue to update the issue:
            - Set the status to "In Review" using the state ID found above

            Confirm the update succeeded before finishing.
