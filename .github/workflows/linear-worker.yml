name: Wedding Planner — Linear Issue Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement-linear-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          mode: agent
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,mcp__linear__*"
          mcp_config: |
            {
              "mcpServers": {
                "linear": {
                  "type": "connector",
                  "connectorId": "8c0518ab-9c19-4121-a304-3cb7c9c4b97c"
                }
              }
            }
          direct_prompt: |
            You are an automated issue worker for the Wedding Planner project
            (https://github.com/louisjlevine/wedding-planner).

            You have access to the Linear MCP connector. Use the mcp__linear__*
            tools to interact with Linear (list issues, get issue details, update
            issue status, etc.).

            ── STEP 0 — PRE-FLIGHT STATUS CHECK ──────────────────────────────

            BEFORE doing any implementation work, you MUST verify the ticket is
            in an actionable state. Use mcp__linear__list_issues to fetch issues
            from the "Wedding Website" project, sorted by priority.

            Pick the highest-priority issue (priority: 1=Urgent, 2=High, 3=Medium,
            4=Low, 0=No priority — treat 0 as lowest).

            Then use mcp__linear__get_issue_status to confirm its state.

            ONLY PROCEED if the state type is "unstarted" or "started" AND the
            state name is NOT any of: "In Review", "Done", "Cancelled", "Closed",
            "Completed", "Archived", "Duplicate".

            If the ticket is in any closed/review/done state, or if no open issues
            exist, print:
              "No actionable issues — skipping this run."
            and STOP IMMEDIATELY. Do not create branches or PRs.

            ── STEP 1 — IMPLEMENT THE ISSUE ───────────────────────────────────

            Use mcp__linear__get_issue to read the full description.
            Read CLAUDE.md for project coding standards.
            Implement the changes. Follow these rules:
            - Tailwind only, no inline styles
            - Pink accent #D4537E for CTAs and active states
            - No emoji in UI (except final wedding day milestone)
            - All AI responses in <pre className="whitespace-pre-wrap">
            Run `npm test` to verify nothing breaks.

            ── STEP 2 — COMMIT AND PUSH ────────────────────────────────────────

            Create a branch named linear/<issue-identifier>-<short-slug>.
            Commit all changes with a message referencing the Linear issue
            identifier (e.g. "WED-42: Add guest RSVP tracking").
            Push the branch to origin.

            ── STEP 3 — CREATE A PULL REQUEST ──────────────────────────────────

            Open a pull request targeting main. Include:
            - Summary of changes (what and why)
            - Link to the Linear issue URL
            - Test results

            ── STEP 4 — MARK ISSUE IN REVIEW ───────────────────────────────────

            Use mcp__linear__list_issue_statuses to find the "In Review" state ID
            for the issue's team. Then use mcp__linear__save_issue to update the
            issue's state to "In Review".

            Confirm the status was updated before finishing.
