name: Wedding Planner — Linear Issue Worker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement-linear-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@beta
        with:
          model: claude-sonnet-4-6
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mcp_config: |
            {
              "mcpServers": {
                "linear": {
                  "type": "connector",
                  "connectorId": "8c0518ab-9c19-4121-a304-3cb7c9c4b97c"
                }
              }
            }
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,mcp__linear__*"
          prompt: |
            You are an automated issue worker for the Wedding Planner project
            (https://github.com/louisjlevine/wedding-planner).

            STEP 1 — CHECK FOR OPEN ISSUES:
            Use the Linear MCP tools to list issues in the "Wedding Website" project.
            Find the highest-priority open issue (lower priority value = higher priority:
            1=Urgent, 2=High, 3=Medium, 4=Low).

            An issue is "open" ONLY if its status type is "unstarted" (Todo) or
            "backlog" (Backlog), or "started" with status name "In Progress".

            IMPORTANT GATE: If the highest-priority issue has status "In Review",
            "Done", "Cancelled", "Duplicate", or any other closed/completed state,
            print "No open issues found — skipping this run." and EXIT immediately
            without making any changes. Do NOT proceed to Step 2.

            STEP 2 — IMPLEMENT THE ISSUE:
            Read the full issue description with get_issue. Explore the codebase to
            understand the architecture (read CLAUDE.md first). Implement the changes
            described by the issue. Follow the project coding standards: Tailwind only,
            no inline styles, pink accent #D4537E, no emoji in UI.
            Run `npm test` to verify nothing breaks.

            STEP 3 — COMMIT AND PUSH:
            Create a branch named linear/<issue-identifier>-<short-slug>.
            Commit all changes with a message referencing the Linear issue ID.
            Push the branch to origin using GITHUB_TOKEN for auth.

            STEP 4 — CREATE A PULL REQUEST:
            Open a pull request targeting main. Include a summary of changes and a
            link to the Linear issue URL in the PR body.

            STEP 5 — UPDATE LINEAR STATUS:
            Use the Linear MCP tools to move the issue to "In Review" status.
